<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Join — Rio Club</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/main.css">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/favicon_io/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon_io/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon_io/favicon-16x16.png">
  <style>
    .join-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(ellipse at 60% 40%, #0d2e70 0%, #011530 70%);
      padding: 40px 20px;
    }
    .join-card {
      background: rgba(10, 29, 68, 0.9);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 20px;
      padding: 56px 52px;
      width: 100%;
      max-width: 480px;
      text-align: center;
      backdrop-filter: blur(12px);
    }
    .join-logo {
      height: 52px;
      width: auto;
      margin: 0 auto 32px;
    }
    .join-card h1 {
      font-size: 1.8rem;
      font-weight: 800;
      color: #fff;
      margin-bottom: 8px;
      letter-spacing: -0.01em;
    }
    .join-card p.sub {
      font-size: 0.92rem;
      color: #8899bb;
      margin-bottom: 36px;
    }
    .join-form {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .join-form input {
      width: 100%;
      padding: 14px 18px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 10px;
      color: #fff;
      font-family: 'Inter', sans-serif;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }
    .join-form input::placeholder { color: #5c73a0; }
    .join-form input:focus { border-color: #FF4D6D; }
    .join-submit {
      margin-top: 8px;
      padding: 15px;
      background: #FF4D6D;
      color: #fff;
      border: none;
      border-radius: 50px;
      font-family: 'Inter', sans-serif;
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      cursor: pointer;
      transition: background 0.2s, transform 0.15s;
    }
    .join-submit:hover  { background: #e03558; }
    .join-submit:active { transform: scale(0.98); }
    .join-message {
      margin-top: 18px;
      font-size: 0.9rem;
      min-height: 24px;
      color: #7ee8a2;
      font-weight: 500;
    }
    .join-back {
      display: inline-block;
      margin-top: 24px;
      font-size: 0.82rem;
      color: #5c73a0;
      text-decoration: none;
      transition: color 0.2s;
    }
    .join-back:hover { color: #fff; }
    @media (max-width: 500px) {
      .join-card { padding: 40px 24px; }
    }
  </style>
</head>
<body>
  <div class="join-page">
    <div class="join-card">
      <img src="images/RIO-04.png" alt="Rio Club" class="join-logo">
      <h1>Join the Club</h1>
      <p class="sub">Fill in the form and we'll be in touch.</p>

      <form class="join-form" id="joinForm" novalidate>
        <input type="text"  id="name"  placeholder="Full name"  required autocomplete="name">
        <input type="email" id="email" placeholder="Email"      required autocomplete="email">
        <button type="submit" class="join-submit">Send</button>
      </form>
      <p class="join-message" id="joinMessage" aria-live="polite"></p>
      <a href="index.html" class="join-back">← Back to site</a>
    </div>
  </div>

  <script>
    document.getElementById('joinForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const name  = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const msg   = document.getElementById('joinMessage');

      if (!name || !email) {
        msg.style.color = '#FF4D6D';
        msg.textContent = 'Please fill in all fields.';
        return;
      }

      // Placeholder — connect to Supabase or any backend here
      msg.style.color = '#7ee8a2';
      msg.textContent = 'Thanks! We\'ll be in touch soon.';
      this.reset();
    });
  </script>
</body>
</html>
